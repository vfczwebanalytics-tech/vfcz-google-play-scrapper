name: Run Google Play Scraper
on:
  schedule:
    - cron: "0 5 * * *"   # každý deň 05:00 UTC
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: scraper
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node extract-with-segmentation.js

      - name: Commit & push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add vodafone-google-play-reviews.json
          git diff --cached --quiet && echo "No changes, skipping" && exit 0
          git commit -m "Auto update reviews"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Retry $i failed, waiting..."
            sleep 5
          done
